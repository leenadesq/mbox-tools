[build-system]
requires = [\"setuptools>=68\", \"wheel\"]
build-backend = \"setuptools.build_meta\"

[project]
name = \"mbox-tools\"
version = \"0.1.0\"
description = \"Small CLI utilities for mbox mail archives: stats, dedupe, date-range split.\"
readme = \"README.md\"
requires-python = \">=3.10\"
license = { text = \"MIT\" }
authors = [
  { name = \"Leena Taylor Paul\" },
]
keywords = [\"mbox\", \"email\", \"archive\", \"forensics\", \"cli\"]
classifiers = [
  \"Development Status :: 3 - Alpha\",
  \"Environment :: Console\",
  \"Intended Audience :: Information Technology\",
  \"License :: OSI Approved :: MIT License\",
  \"Programming Language :: Python :: 3\",
  \"Programming Language :: Python :: 3.10\",
  \"Programming Language :: Python :: 3.11\",
  \"Programming Language :: Python :: 3.12\",
  \"Topic :: Communications :: Email\",
  \"Topic :: Utilities\",
]
dependencies = []

[project.optional-dependencies]
dev = [\"pytest>=7.0\"]

[project.scripts]
mbox-tools = \"mbox_tools.cli:main\"

[project.urls]
Homepage = \"https://github.com/leenadesq/mbox-tools\"
Issues = \"https://github.com/leenadesq/mbox-tools/issues\"

[tool.setuptools.packages.find]
where = [\"src\"]

